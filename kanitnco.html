<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังความรู้คณิตศาสตร์ - เตรียมสอบนายทหารประทวน</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        military: {
                            light: '#a3b18a',
                            DEFAULT: '#588157',
                            dark: '#3a5a40',
                            darker: '#344e41',
                        }
                    }
                }
            }
        }
    </script>
    <!-- MathJax for rendering math equations -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background-color: #f3f4f6; }
        .hide { display: none !important; }
        .math-content { overflow-x: auto; padding-bottom: 0.5rem; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen pb-12">

    <!-- Navbar -->
    <nav class="bg-military-darker text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showMenu()">
                <i class="ph ph-student text-3xl"></i>
                <h1 class="text-lg font-semibold leading-tight">เตรียมสอบนายทหารประทวน<br><span class="text-sm font-normal text-military-light">คณิตศาสตร์ ชุดที่ 1 (100 ข้อ)</span></h1>
            </div>
            <button onclick="showMenu()" class="p-2 hover:bg-military-dark rounded-full transition" title="กลับหน้าหลัก">
                <i class="ph ph-house text-2xl"></i>
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-4 mt-6" id="app">

        <!-- 1. Menu View -->
        <div id="view-menu" class="space-y-6 animate-fade-in">
            <div class="bg-white rounded-2xl shadow-md p-6 sm:p-8 text-center border-t-4 border-military">
                <img src="https://cdn-icons-png.flaticon.com/512/3143/3143620.png" alt="Math" class="w-24 h-24 mx-auto mb-4 opacity-80" onerror="this.style.display='none'">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">ยินดีต้อนรับสู่คลังความรู้</h2>
                <p class="text-gray-600 mb-8">เลือกโหมดที่คุณต้องการใช้งานด้านล่างนี้</p>
                
                <div class="grid sm:grid-cols-2 gap-4">
                    <button onclick="startLesson()" class="flex flex-col items-center justify-center p-6 bg-blue-50 hover:bg-blue-100 border-2 border-blue-200 rounded-xl transition cursor-pointer group">
                        <i class="ph ph-book-open-text text-5xl text-blue-500 mb-3 group-hover:scale-110 transition-transform"></i>
                        <h3 class="font-semibold text-xl text-blue-800">โหมดบทเรียน</h3>
                        <p class="text-sm text-blue-600 mt-1">สรุปเนื้อหา สูตร และเทคนิค</p>
                    </button>
                    
                    <button onclick="startQuiz()" class="flex flex-col items-center justify-center p-6 bg-military-light/20 hover:bg-military-light/40 border-2 border-military-light rounded-xl transition cursor-pointer group">
                        <i class="ph ph-pencil-simple-list text-5xl text-military-dark mb-3 group-hover:scale-110 transition-transform"></i>
                        <h3 class="font-semibold text-xl text-military-darker">ทำแบบทดสอบ</h3>
                        <p class="text-sm text-military-dark mt-1">ทำข้อสอบ 100 ข้อ พร้อมจับคะแนน</p>
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. Lesson View -->
        <div id="view-lesson" class="hide space-y-4">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-4 sticky top-[70px] z-40 border-b border-gray-200">
                <h2 class="text-xl font-bold text-gray-800">📖 สรุปเนื้อหาคณิตศาสตร์ (ติวเข้มก่อนสอบ)</h2>
                <div class="text-sm text-gray-500">รวมสูตรที่ออกสอบบ่อย</div>
            </div>
            <div id="lesson-container" class="space-y-6">
                <!-- Lesson items will be injected here -->
            </div>
            <div class="text-center mt-8">
                <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-2 rounded-full font-medium transition">
                    <i class="ph ph-arrow-up mr-1"></i> เลื่อนขึ้นบนสุด
                </button>
            </div>
        </div>

        <!-- 3. Quiz View -->
        <div id="view-quiz" class="hide">
            <div class="bg-white rounded-2xl shadow-md overflow-hidden">
                <!-- Progress Bar -->
                <div class="bg-gray-200 h-2 w-full">
                    <div id="quiz-progress" class="bg-military h-2 transition-all duration-300" style="width: 0%;"></div>
                </div>
                
                <div class="p-6 sm:p-8">
                    <div class="flex justify-between items-center mb-6">
                        <span class="bg-military-light/30 text-military-darker text-sm font-bold px-3 py-1 rounded-full">
                            ข้อ <span id="current-q-num">1</span> / 100
                        </span>
                    </div>
                    
                    <h3 id="quiz-question" class="text-xl sm:text-2xl font-medium text-gray-800 mb-8 math-content leading-relaxed">
                        <!-- Question text -->
                    </h3>
                    
                    <div id="quiz-options" class="space-y-3">
                        <!-- Options will be injected here -->
                    </div>
                </div>
                
                <div class="bg-gray-50 px-6 py-4 border-t flex justify-end">
                    <button id="btn-next" onclick="nextQuestion()" class="bg-military hover:bg-military-dark text-white px-8 py-3 rounded-xl font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2" disabled>
                        <span>ต่อไป</span> <i class="ph ph-caret-right text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 4. Result View -->
        <div id="view-result" class="hide space-y-6">
            <div class="bg-white rounded-2xl shadow-md p-8 text-center border-t-4 border-military">
                <h2 class="text-3xl font-bold text-gray-800 mb-2">สรุปผลการทดสอบ</h2>
                <div class="my-8">
                    <div class="inline-flex items-center justify-center w-32 h-32 rounded-full border-8 border-military-light text-military-darker text-4xl font-bold bg-gray-50">
                        <span id="score-display">0</span><span class="text-lg text-gray-500">/100</span>
                    </div>
                </div>
                <p id="score-message" class="text-lg text-gray-600 mb-6 font-medium"></p>
                <div class="flex flex-wrap justify-center gap-4">
                    <button onclick="startQuiz()" class="bg-military hover:bg-military-dark text-white px-6 py-3 rounded-xl font-medium transition flex items-center gap-2">
                        <i class="ph ph-arrow-counter-clockwise"></i> ทำแบบทดสอบใหม่
                    </button>
                    <button onclick="showMenu()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-3 rounded-xl font-medium transition flex items-center gap-2">
                        <i class="ph ph-house"></i> กลับหน้าหลัก
                    </button>
                </div>
            </div>

            <h3 class="text-xl font-bold text-gray-800 mt-8 mb-4 px-2">ตรวจสอบคำตอบ</h3>
            <div id="result-details" class="space-y-4">
                <!-- Result items injected here -->
            </div>
        </div>

    </main>

    <script>
        // Data Extraction from Set 1 (100 Questions)
        // Format: q: Question, o: Options, a: Correct Answer Index (0-3), e: Explanation
        const quizData = [
            { q: "ถ้า $2X+5=15$ ค่า X คือเท่าไร", o: ["3", "5", "10", "20"], a: 1, e: "$2x+5=15 \\rightarrow 2x=10 \\rightarrow x=5$" },
            { q: "ค่าของ $\\sqrt{144}$ คือเท่าไร", o: ["10", "11", "12", "13"], a: 2, e: "$\\sqrt{144}=12$" },
            { q: "ถ้า $a = 3, b=4$ ค่าของ $a^{2}+b^{2}$ คือเท่าไร", o: ["12", "16", "25", "7"], a: 2, e: "$a^{2}+b^{2}=3^{2}+4^{2}=9+16=25$" },
            { q: "ผลบวกของเลขอนุกรม $2+4+6+...+20$ คือเท่าไร", o: ["100", "110", "120", "220"], a: 1, e: "เป็นอนุกรมเลขคู่ที่มี $n=10$ พจน์ (2 ถึง 20)<br>ผลบวก = $(n/2)$(พจน์แรก + พจน์สุดท้าย) = $(10/2)(2+20) = 5 \\times 22 = 110$" },
            { q: "$7/14$ เท่ากับเศษส่วนใดที่ต่ำที่สุด", o: ["$2/3$", "$1/2$", "$3/7$", "$5/14$"], a: 1, e: "$7/14 = 1/2$" },
            { q: "ค่าเฉลี่ยเลขคณิตของ 10, 20, 30, 40 คือเท่าไร", o: ["20", "25", "30", "35"], a: 1, e: "ค่าเฉลี่ย = $(10+20+30+40)/4 = 100/4 = 25$" },
            { q: "$(X-3)(X+3)=?$", o: ["$x^{2}+9$", "$x^{2}-9$", "$x^{2}+6x+9$", "$x^{2}-6x+9$"], a: 1, e: "$(x-3)(x+3)=x^{2}-9$ (ผลต่างกำลังสอง)" },
            { q: "ถ้า $3x=27$ ค่าของ x เท่ากับเท่าไร", o: ["3", "6", "9", "12"], a: 2, e: "$3x=27 \\rightarrow x=9$" },
            { q: "ค่าของ $(2^{3}\\times 2^{4})$ คือเท่าไร", o: ["16", "32", "64", "128"], a: 3, e: "$2^{3}\\times 2^{4}=2^{3+4}=2^{7}=128$" },
            { q: "ถ้าความยาวสี่เหลี่ยมผืนผ้า $=12$ กว้าง $=5$ พื้นที่เท่ากับเท่าไร", o: ["17", "30", "60", "120"], a: 2, e: "พื้นที่ = ยาว x กว้าง = 12 x 5 = 60" },
            { q: "ค่าของ $3/4 \\div 2/3$ เท่ากับข้อใด", o: ["$9/8$", "$1/2$", "$6/7$", "$8/9$"], a: 0, e: "$(3/4)\\div(2/3)=(3/4)\\times(3/2)=9/8$" },
            { q: "ผลบวกของรากสมการ $x^{2}-7x+10=0$ คือเท่าไร", o: ["5", "7", "10", "-7"], a: 1, e: "สมการ $ax^{2}+bx+c=0$ ผลบวกของราก = $-b/a = -(-7)/1 = 7$" },
            { q: "ผลคูณของรากสมการ $x^{2}-5x+6=0$ คือเท่าไร", o: ["6", "5", "-6", "-5"], a: 0, e: "ผลคูณของราก = $c/a = 6/1 = 6$" },
            { q: "ผลบวกของ $1+2+3+...+50$ เท่ากับเท่าไร", o: ["1225", "1250", "1275", "2550"], a: 2, e: "ผลบวก $S_n = (n(n+1))/2 = 50\\times 51/2 = 1275$" },
            { q: "ค่า $\\sin 30^\\circ$ เท่ากับเท่าไร", o: ["$1/2$", "$\\sqrt{3}/2$", "0", "1"], a: 0, e: "$\\sin 30^\\circ = 1/2$" },
            { q: "ถ้า $2x-5=3$ ค่าของ x คือเท่าไร", o: ["2", "3", "4", "5"], a: 2, e: "$2x-5=3 \\rightarrow 2x=8 \\rightarrow x=4$" },
            { q: "ผลบวกของ $0.25+0.75$ คือเท่าไร", o: ["0.5", "0.75", "1", "1.25"], a: 2, e: "$0.25+0.75=1$" },
            { q: "ถ้า $\\log_{10} 1000 = ?$ ", o: ["1", "2", "3", "4"], a: 2, e: "$10^{3}=1000 \\rightarrow \\log_{10} 10^{3} = 3\\log_{10} 10 = 3$" },
            { q: "ค่าของ $(x+2)^{2}$ เมื่อ $x=3$", o: ["9", "16", "25", "36"], a: 2, e: "$(3+2)^{2} = 5^{2} = 25$" },
            { q: "ถ้ารัศมีวงกลม $=7$ ซม. พื้นที่วงกลมเท่ากับเท่าไร (ใช้ $\\pi=22/7$)", o: ["154", "308", "77", "44"], a: 0, e: "พื้นที่ = $\\pi r^{2} = (22/7)\\times 7^{2} = (22/7)\\times 49 = 154$" },
            { q: "ถ้า $5x=2x+12$ ค่าของ x คือเท่าไร", o: ["2", "3", "4", "6"], a: 2, e: "$5x-2x=12 \\rightarrow 3x=12 \\rightarrow x=4$" },
            { q: "$(x-1)(x-2)=?$", o: ["$x^{2}-3x+2$", "$x^{2}-2x-1$", "$x^{2}+x-2$", "$x^{2}-x+2$"], a: 0, e: "$(x-1)(x-2) = x^{2}-2x-x+2 = x^{2}-3x+2$" },
            { q: "ค่า 5! (แฟกทอเรียล) เท่ากับเท่าไร", o: ["60", "100", "120", "240"], a: 2, e: "$5! = 5\\times 4\\times 3\\times 2\\times 1 = 120$" },
            { q: "ค่าของ $\\sqrt{225}$ เท่ากับข้อใด", o: ["12", "13", "14", "15"], a: 3, e: "$\\sqrt{225} = 15$" },
            { q: "ถ้า $x^{2} = 81$ ค่าของ x อาจเป็นเท่าไร", o: ["9", "-9", "$\\pm 9$", "81"], a: 2, e: "$x^{2} = 81 \\rightarrow x = \\pm 9$" },
            { q: "ผลบวกของ $1/3+2/3$ คือเท่าไร", o: ["$1/3$", "$2/3$", "1", "$5/3$"], a: 2, e: "$1/3+2/3 = 3/3 = 1$" },
            { q: "ผลลัพธ์ของ $(2x^{2})(3x^{3})$ เท่ากับ", o: ["$5x^{5}$", "$6x^{5}$", "$6x^{6}$", "$5x^{6}$"], a: 1, e: "$(2x^{2})(3x^{3}) = 6x^{(2+3)} = 6x^{5}$" },
            { q: "ถ้า $a=2, b=-3$ ค่าของ $ab$ คือ", o: ["-5", "5", "-6", "6"], a: 2, e: "$a\\times b = 2 \\times (-3) = -6$" },
            { q: "$(3/5)$ ของ 100 เท่ากับ", o: ["40", "50", "60", "80"], a: 2, e: "$(3/5)\\times 100 = 60$" },
            { q: "ผลบวกของมุมภายในสามเหลี่ยมเท่ากับกี่องศา", o: ["$90^\\circ$", "$120^\\circ$", "$180^\\circ$", "$360^\\circ$"], a: 2, e: "มุมในสามเหลี่ยมรวม $= 180^\\circ$" },
            { q: "ถ้า $\\log_{10} x = 2$ ค่า x เท่ากับเท่าไร", o: ["10", "20", "100", "1000"], a: 2, e: "$\\log_{10} x = 2 \\rightarrow x = 10^{2} = 100$" },
            { q: "ผลต่างระหว่าง $3/4 - 2/5$ เท่ากับ", o: ["$7/20$", "$7/10$", "$1/20$", "$11/20$"], a: 0, e: "$3/4 - 2/5 = 15/20 - 8/20 = 7/20$" },
            { q: "$(x+1)^{2}=?$", o: ["$x^{2}+1$", "$x^{2}+2x+1$", "$x^{2}-2x+1$", "$x^{2}+x+1$"], a: 1, e: "$(x+1)^{2} = x^{2}+2x+1$" },
            { q: "ค่าของ $\\cos 60^\\circ$ คือ", o: ["$1/2$", "$\\sqrt{3}/2$", "0", "1"], a: 0, e: "$\\cos 60^\\circ = 1/2$" },
            { q: "ค่าเฉลี่ยของ 5, 10, 15, 20, 25 เท่ากับ", o: ["10", "12", "15", "20"], a: 2, e: "ค่าเฉลี่ย = $(5+10+15+20+25)/5 = 75/5 = 15$" },
            { q: "ความยาวเส้นทแยงมุมสี่เหลี่ยมจัตุรัสที่มีด้านยาว 10 คือเท่าไร", o: ["$10\\sqrt{2}$", "20", "20/2", "15"], a: 0, e: "เส้นทแยงมุม $= 10\\sqrt{2}$" },
            { q: "สมการเส้นตรง $y=2x+1$ มีความชันเท่าไร", o: ["1", "2", "-2", "-1"], a: 1, e: "ความชันคือค่าสัมประสิทธิ์ของ x ซึ่งเท่ากับ 2" },
            { q: "ผลบวกของ $2^{5}+2^{6}$ คือเท่าไร", o: ["64", "96", "128", "192"], a: 1, e: "$2^{5}+2^{6} = 32+64 = 96$" },
            { q: "ค่าของ $\\tan 45^\\circ$ เท่ากับ", o: ["0", "1", "$\\sqrt{3}$", "$\\infty$"], a: 1, e: "$\\tan 45^\\circ = 1$" },
            { q: "ผลบวกของเลขคู่ตั้งแต่ 2 ถึง 100 คือ", o: ["2450", "2500", "2550", "2600"], a: 2, e: "จำนวนพจน์ = 50, ผลบวก = $(n/2)$(พจน์แรก+พจน์สุดท้าย) = $25\\times(2+100) = 25\\times 102 = 2550$" },
            { q: "ถ้า $x/3=9$ ค่า x เท่ากับเท่าไร", o: ["9", "18", "27", "30"], a: 2, e: "$x/3=9 \\rightarrow x=27$" },
            { q: "ค่าของ $(\\sqrt{2})^{2}$ คือ", o: ["1", "2", "3", "4"], a: 1, e: "$(\\sqrt{2})^{2} = 2$" },
            { q: "$(a+b)^{2}-(a-b)^{2} = ?$", o: ["2ab", "4ab", "$a^{2}+b^{2}$", "$a^{2}-b^{2}$"], a: 1, e: "$(a^{2}+2ab+b^{2}) - (a^{2}-2ab+b^{2}) = 4ab$" },
            { q: "ถ้า $\\sin \\theta = 3/5$, $\\cos \\theta = 4/5$, ค่าของ $\\tan \\theta = ?$", o: ["$3/4$", "$4/3$", "$5/3$", "$5/4$"], a: 0, e: "$\\tan \\theta = \\sin \\theta / \\cos \\theta = (3/5) / (4/5) = 3/4$" },
            { q: "ผลบวกของรากสมการ $x^{2}-8x+15=0$", o: ["7", "8", "15", "-8"], a: 1, e: "ผลบวกของราก = $-b/a = -(-8)/1 = 8$" },
            { q: "ค่าของ $0.2 \\times 0.3$ คือ", o: ["0.06", "0.23", "0.26", "0.60"], a: 0, e: "$0.2 \\times 0.3 = 0.06$" },
            { q: "ผลลัพธ์ของ $(x^{3})(x^{2})$ คือ", o: ["$x^{5}$", "$x^{6}$", "$x^{8}$", "$x^{9}$"], a: 0, e: "$x^{3}\\times x^{2} = x^{(3+2)} = x^{5}$" },
            { q: "$(x+5)(x-5)=?$", o: ["$x^{2}+25$", "$x^{2}-25$", "$x^{2}+10x-25$", "$x^{2}-10x+25$"], a: 1, e: "$(x+5)(x-5) = x^{2}-25$ (ผลต่างกำลังสอง)" },
            { q: "ผลบวกของเลขคี่ตั้งแต่ 1 ถึง 99 คือ", o: ["2500", "4900", "2550", "10000"], a: 0, e: "ผลบวกเลขคี่ $n$ พจน์ = $n^{2}$, ที่นี่ $n=50 \\rightarrow 50^{2} = 2500$" },
            { q: "ค่าของ $\\log_{10} 1$ คือ", o: ["0", "1", "10", "ไม่กำหนด"], a: 0, e: "$\\log_{10} 1 = 0$" },
            { q: "ผลบวกของ $2/7+3/7$ คือ", o: ["$4/7$", "$5/7$", "1", "$7/7$"], a: 1, e: "$2/7+3/7 = 5/7$" },
            { q: "ค่าของ $(1/2)^{3}$ คือ", o: ["$1/2$", "$1/4$", "$1/8$", "$1/16$"], a: 2, e: "$(1/2)^{3} = 1/8$" },
            { q: "ถ้า $x+y=10, y=4$ ค่า x เท่ากับเท่าไร", o: ["4", "5", "6", "7"], a: 2, e: "$x+4=10 \\rightarrow x=6$" },
            { q: "ค่าของ $12^{2} - 9^{2}$ คือ", o: ["9", "27", "63", "81"], a: 2, e: "$12^{2}-9^{2} = (12-9)(12+9) = 3 \\times 21 = 63$" },

                        <li><b>ความน่าจะเป็น:</b> $P(E) = \\frac{n(E)}{n(S)}$ <br>(จำนวนเหตุการณ์ที่สนใจ $\\div$ จำนวนเหตุการณ์ที่เป็นไปได้ทั้งหมด)</li>
                        <li><b>ลำดับและอนุกรมเลขคณิต:</b>
                            <ul class="list-[circle] pl-5 mt-1 space-y-1 text-sm text-military-dark">
                                <li>สูตรผลบวก $n$ พจน์แรก: $S_n = \\frac{n}{2}(a_1 + a_n)$</li>
                                <li>ผลบวกเลข 1 ถึง n: $\\frac{n(n+1)}{2}$ <br><span class="text-gray-500">ตัวอย่าง:</span> $1+2+3+...+50 = \\frac{50(51)}{2} = 1275$</li>
                            </ul>
                        </li>
                    </ul>
                `
            }
        ];

        // App State
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(100).fill(null);

        // Utility: Hide all views
        function hideAllViews() {
            document.getElementById('view-menu').classList.add('hide');
            document.getElementById('view-lesson').classList.add('hide');
            document.getElementById('view-quiz').classList.add('hide');
            document.getElementById('view-result').classList.add('hide');
        }

        // Show Math equations
        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise().catch(function (err) {
                    console.error('MathJax error:', err.message);
                });
            }
        }

        // Navigation Functions
        function showMenu() {
            hideAllViews();
            document.getElementById('view-menu').classList.remove('hide');
            window.scrollTo(0,0);
        }

        // ---------- Lesson Mode ----------
        function startLesson() {
            hideAllViews();
            const container = document.getElementById('lesson-container');
            container.innerHTML = '';
            
            lessonData.forEach((lesson, index) => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 sm:p-8 rounded-2xl shadow-sm border-t-4 border-blue-500 hover:shadow-md transition";
                
                card.innerHTML = `
                    <div class="flex items-center gap-3 mb-4 border-b pb-3">
                        <div class="bg-blue-100 text-blue-600 rounded-lg w-12 h-12 flex items-center justify-center shrink-0">
                            <i class="ph ${lesson.icon} text-3xl"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800">${lesson.title}</h3>
                    </div>
                    <div class="math-content text-base leading-relaxed">
                        ${lesson.content}
                    </div>
                `;
                container.appendChild(card);
            });
            
            document.getElementById('view-lesson').classList.remove('hide');
            renderMath();
            window.scrollTo(0,0);
        }

        // ---------- Quiz Mode ----------
        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers.fill(null);
            hideAllViews();
            document.getElementById('view-quiz').classList.remove('hide');
            loadQuestion();
        }

        function loadQuestion() {
            const data = quizData[currentQuestionIndex];
            
            // Update UI
            document.getElementById('current-q-num').textContent = currentQuestionIndex + 1;
            document.getElementById('quiz-progress').style.width = `${((currentQuestionIndex) / 100) * 100}%`;
            document.getElementById('quiz-question').innerHTML = data.q;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            data.o.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border-2 border-gray-200 hover:border-military hover:bg-military-light/10 transition flex items-center gap-3 group";
                btn.innerHTML = `
                    <div class="w-8 h-8 rounded-full border-2 border-gray-300 flex items-center justify-center shrink-0 group-hover:border-military text-gray-500 font-medium">${idx+1}</div>
                    <div class="math-content flex-grow">${opt}</div>
                `;
                btn.onclick = () => selectOption(idx);
                optionsContainer.appendChild(btn);
            });
            
            // Check if already answered (for navigating back, though currently strictly forward)
            const btnNext = document.getElementById('btn-next');
            if (userAnswers[currentQuestionIndex] !== null) {
                selectOption(userAnswers[currentQuestionIndex], true);
            } else {
                btnNext.disabled = true;
            }

            if (currentQuestionIndex === quizData.length - 1) {
                btnNext.innerHTML = '<span>ส่งคำตอบ</span> <i class="ph ph-paper-plane-right"></i>';
                btnNext.classList.replace('bg-military', 'bg-blue-600');
                btnNext.classList.replace('hover:bg-military-dark', 'hover:bg-blue-700');
            } else {
                btnNext.innerHTML = '<span>ต่อไป</span> <i class="ph ph-caret-right text-lg"></i>';
                btnNext.classList.replace('bg-blue-600', 'bg-military');
                btnNext.classList.replace('hover:bg-blue-700', 'hover:bg-military-dark');
            }

            renderMath();
            window.scrollTo(0,0);
        }

        function selectOption(idx, isReview = false) {
            userAnswers[currentQuestionIndex] = idx;
            const buttons = document.getElementById('quiz-options').querySelectorAll('button');
            
            buttons.forEach((btn, i) => {
                const indicator = btn.querySelector('div');
                if (i === idx) {
                    btn.classList.add('border-military', 'bg-military-light/20');
                    btn.classList.remove('border-gray-200', 'hover:bg-military-light/10');
                    indicator.classList.add('bg-military', 'text-white', 'border-military');
                    indicator.classList.remove('border-gray-300', 'text-gray-500');
                } else {
                    btn.classList.remove('border-military', 'bg-military-light/20');
                    btn.classList.add('border-gray-200', 'hover:bg-military-light/10');
                    indicator.classList.remove('bg-military', 'text-white', 'border-military');
                    indicator.classList.add('border-gray-300', 'text-gray-500');
                }
            });
            
            document.getElementById('btn-next').disabled = false;
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        // ---------- Result Mode ----------
        function finishQuiz() {
            // Calculate score
            score = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === quizData[idx].a) score++;
            });

            hideAllViews();
            
            // Display Result Header
            document.getElementById('score-display').textContent = score;
            const messageEl = document.getElementById('score-message');
            if(score >= 80) {
                messageEl.innerHTML = "ยอดเยี่ยมมาก! คุณพร้อมสำหรับการสอบแล้ว 🌟";
                messageEl.className = "text-lg text-green-600 font-bold mb-6";
            } else if(score >= 50) {
                messageEl.innerHTML = "ทำได้ดี! แต่ยังสามารถฝึกฝนเพิ่มเติมได้อีก 👍";
                messageEl.className = "text-lg text-blue-600 font-bold mb-6";
            } else {
                messageEl.innerHTML = "อย่าเพิ่งท้อ! ลองทบทวนบทเรียนแล้วกลับมาทำใหม่นะ 💪";
                messageEl.className = "text-lg text-orange-600 font-bold mb-6";
            }

            // Build Result Details
            const detailsContainer = document.getElementById('result-details');
            detailsContainer.innerHTML = '';

            quizData.forEach((data, idx) => {
                const userAns = userAnswers[idx];
                const isCorrect = userAns === data.a;
                
                const card = document.createElement('div');
                card.className = `p-5 rounded-2xl border-2 ${isCorrect ? 'border-green-200 bg-green-50/30' : 'border-red-200 bg-red-50/30'}`;
                
                let userPickText = userAns !== null ? data.o[userAns] : "<i>(ไม่ได้ตอบ)</i>";
                let correctPickText = data.o[data.a];

                card.innerHTML = `
                    <div class="flex items-start gap-3 mb-3">
                        <div class="mt-1">
                            ${isCorrect 
                                ? '<i class="ph-fill ph-check-circle text-green-500 text-2xl"></i>' 
                                : '<i class="ph-fill ph-x-circle text-red-500 text-2xl"></i>'}
                        </div>
                        <div class="w-full">
                            <h4 class="font-medium text-gray-800 math-content">ข้อ ${idx+1}. ${data.q}</h4>
                            <div class="mt-2 text-sm grid sm:grid-cols-2 gap-2">
                                <div class="${isCorrect ? 'text-green-700 font-medium' : 'text-red-600'}">
                                    <span class="text-gray-500">คำตอบของคุณ:</span> <span class="math-content">${userPickText}</span>
                                </div>
                                ${!isCorrect ? `
                                <div class="text-green-700 font-medium">
                                    <span class="text-gray-500">คำตอบที่ถูกต้อง:</span> <span class="math-content">${correctPickText}</span>
                                </div>
                                ` : ''}
                            </div>
                            <div class="mt-3 bg-white bg-opacity-60 p-3 rounded-lg text-sm text-gray-700 border border-gray-100">
                                <strong>วิธีทำ:</strong> <span class="math-content block mt-1">${data.e}</span>
                            </div>
                        </div>
                    </div>
                `;
                detailsContainer.appendChild(card);
            });

            document.getElementById('view-result').classList.remove('hide');
            renderMath();
            window.scrollTo(0,0);
        }

    </script>
</body>
</html>
